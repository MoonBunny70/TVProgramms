services:
  db:
    image: postgres:18
    container_name: tv_guide_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tvguide_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tvguide_user -d tvguide"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tvguide_data: